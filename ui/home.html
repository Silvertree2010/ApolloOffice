<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApolloOffice</title>
<link rel="stylesheet" href="style.css">
<style>
body { display: block; overflow: auto; max-width: 860px; margin: 0 auto; padding: 28px 18px; }
h1 { font-size: 24px; margin-bottom: 4px; }
.sub { color: var(--t3); margin: 0 0 22px; }
.of { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--l); }
.of .n { font: 600 16px var(--m); }
.of .t { color: var(--t2); grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.of .m { color: var(--t3); font: 11px var(--m); grid-column: 1; }
.of .chip { grid-row: 1 / 3; grid-column: 2; align-self: center; }
form { display: grid; gap: 8px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--l); }
form h2 { font: 600 11px/1 var(--m); text-transform: uppercase; letter-spacing: .1em; color: var(--t2); margin: 0 0 4px; }
input, textarea { font: 13px/1.4 var(--s); color: var(--t1); background: var(--p); border: 1px solid var(--l); border-radius: 6px; padding: 8px; }
label { display: grid; gap: 4px; color: var(--t2); font-size: 12px; }
.er { color: var(--bad); font-size: 12px; min-height: 1em; }
form button { justify-self: start; }
</style>
</head>
<body>
<h1>ApolloOffice</h1>
<p class="sub">Local offices of Claude workers. Give the CEO a task, it builds the team.</p>
<div id="list"></div>
<form id="f">
  <h2>New office</h2>
  <label>Name <input name="name" required pattern="[a-z0-9][a-z0-9-]{0,31}" placeholder="bugfix-office"></label>
  <label>Task for the CEO <textarea name="task" rows="3" required placeholder="Find and fix failing tests in this repo, one pull request per fix."></textarea></label>
  <label>Work folder (absolute path) <input name="dir" required placeholder="/Users/you/projects/my-app"></label>
  <div class="er" id="er"></div>
  <button class="go">Create office</button>
</form>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const L = { new: ["CEO is designing", "info"], draft: ["waiting for approval", "info"], review: ["needs approval", "bad"], run: ["running", "ok"], pause: ["paused", ""] };
const load = async () => {
  try {
    const l = await (await fetch("/api/offices", { cache: "no-store" })).json();
    document.getElementById("list").innerHTML = l.length ? l.map((o) => { const [t, k] = L[o.st] || [o.st, ""]; return `<a class="of" href="/o/${esc(o.name)}/"><span class="n">${esc(o.name)}</span><span class="t">${esc(o.task)}</span><span class="m">${o.open} open · ${o.done} done · ${esc(o.dir)}</span><span class="chip ${o.why ? "bad" : k}">${esc(o.why || t)}</span></a>`; }).join("") : `<p class="empty">No offices yet.</p>`;
  } catch {}
  setTimeout(load, 3000);
};
load();
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const b = Object.fromEntries(new FormData(e.target));
  const r = await (await fetch("/api/new", { method: "POST", headers: { "content-type": "application/json", "x-office": "1" }, body: JSON.stringify(b) })).json();
  if (r.error) return (document.getElementById("er").textContent = r.error);
  location.href = r.url.replace(/^https?:\/\/[^/]+/, "");
};
</script>
</body>
</html>
