  <a href="#/jobs" data-r="jobs"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Jobs</span><b class="cnt" id="nJobs"></b></a>
  <a href="#/prs" data-r="prs"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M6 8v8M18 16V9a3 3 0 0 0-3-3h-4"/></svg><span>Pull requests</span><b class="cnt" id="nPr"></b></a>

<div class="app">
<header>
  <h1 id="vt">Office</h1>
  <button class="chip hc" id="cH" hidden></button>
  <span class="chip" id="cHo"></span>
  <span class="chip" id="cQ"></span>
  <span class="sp"></span>
  <span class="vtools" id="vtOffice"><button id="bCz">Edit office</button><button id="bLay">Edit layout</button></span>
  <button id="bTh" class="ic" title="Light or dark" aria-label="Light or dark"></button>
  <button id="bPause">Pause office</button>
</header>
<div class="ban" id="ban" hidden><span>Enjoying ApolloOffice? A star on GitHub helps other people find it.</span><span class="sp"></span><button class="go" id="bStar">Star on GitHub</button><button id="bLater">Later</button></div>
<div id="lay">
<div class="tiles lp" id="tiles" data-lp="tiles"></div>
<main>
  <div class="cz" id="cz" hidden></div><div class="stage lp" id="stage" data-lp="stage"><canvas id="cv"></canvas><div class="mg" id="mg" hidden></div></div><div class="tip" id="tip" hidden></div>
  <div class="side">
    <div class="card lp" data-lp="queue"><h2>Queue <span id="qn"></span></h2><div class="bd" id="queue"></div></div>
    <div class="card lp" data-lp="prs"><h2>Pull requests <span id="prn"></span></h2><div class="bars" id="bars" title="merges per day, last 30 days"></div><div class="bd" id="prs"></div></div>
    <div class="card lp" data-lp="log"><h2>Log</h2><div class="lh"><select id="logW" aria-label="Filter log by worker"><option value="">All workers</option></select><input type="text" id="logQ" placeholder="Search log" aria-label="Search log" autocomplete="off"><button type="button" id="logWrap">Wrap</button></div><div class="bd log" id="log"></div></div>
  </div>
  <div class="card lp wdg" data-lp="approvals"><h2>Waiting for you <span id="wApN"></span></h2><div class="bd" id="wAp"></div></div>
  <div class="card lp wdg" data-lp="costs"><h2>Costs</h2><div class="bd" id="wCo"></div></div>
  <div class="card lp wdg" data-lp="machines"><h2>Machines</h2><div class="bd" id="wMa"></div></div>
  <div class="card lp wdg" data-lp="pipelines"><h2>Pipelines</h2><div class="bd" id="wPi"></div></div>
  <div class="card lp wdg" data-lp="team"><h2>Team</h2><div class="bd" id="wTe"></div></div>
  <div class="card lp wdg" data-lp="merges"><h2>Merges <span id="wMgN"></span></h2><div class="bd" id="wMg"></div></div>
  <div class="card lp wdg" data-lp="repohealth"><h2>Repositories</h2><div class="bd" id="wRe"></div></div>
</main>
</div>
<div class="fe" id="fe" hidden></div>
<div class="pg" id="pg" hidden><div class="pgb" id="pgB"></div></div>
</div>
<div id="dr" hidden><div class="pn"><div class="ph"><h3 id="drT"></h3><button id="drX">Close</button></div><div class="pb" id="drB"></div></div></div>
<script src="body.js"></script>
<script src="o.js"></script>
<script src="p.js"></script>
<script src="f.js"></script>
<script src="l.js"></script>
<script src="v.js"></script>
<script src="r.js"></script>

</html>
