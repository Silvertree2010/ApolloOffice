name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: apollo-office-windows-x64.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, name: apollo-office-windows-arm64.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: apollo-office-linux-x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, name: apollo-office-linux-arm64, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, name: apollo-office-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: apollo-office-macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        run: cargo install cross --locked
      - if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          f=target/${{ matrix.target }}/release/apollo-office
          [ -f "$f.exe" ] && f="$f.exe"
          cp "$f" "${{ matrix.name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          mkdir dist && cd dist
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -p 'apollo-office-*'
          python3 - <<'PY'
          import hashlib, json, os
          f = {n: hashlib.sha256(open(n, "rb").read()).hexdigest() for n in sorted(os.listdir(".")) if n.startswith("apollo-office-")}
          open("latest.json", "w").write(json.dumps({"v": os.environ["GITHUB_REF_NAME"].lstrip("v"), "files": f}))
          PY
          printf '%s\n' "$RELEASE_KEY" > ../k.pem
          openssl pkeyutl -sign -inkey ../k.pem -rawin -in latest.json | base64 -w0 > latest.json.sig
          rm ../k.pem
          gh release upload "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" latest.json latest.json.sig --clobber
