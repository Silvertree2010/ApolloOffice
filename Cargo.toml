[package]
name = "apollo-office"
version = "0.3.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "A pixel skyscraper full of AI workers that runs on your own machine"
repository = "https://github.com/Silvertree2010/ApolloOffice"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
ed25519-dalek = "2"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
rquickjs = { version = "0.9", features = ["futures"] }
russh = "0.52"
regex = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
futures = "0.3"
anyhow = "1"
mime_guess = "2"
url = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
rquickjs = { version = "0.9", features = ["futures", "bindgen"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
lto = "thin"
strip = true
opt-level = 3
