[package]
name = "apollo-office"
version = "0.8.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "AI workers that turn GitHub issues into verified bug-fix pull requests, running on your own computer"
homepage = "https://office.apollonet.dev"
keywords = ["ai", "github", "bug-fixing", "pull-requests", "agents"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/Silvertree2010/ApolloOffice"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dirs = "5"
anyhow = "1"
mime_guess = "2"
futures = "0.3"
aes-gcm = "0.10"
ed25519-dalek = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
